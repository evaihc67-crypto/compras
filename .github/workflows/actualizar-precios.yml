name: Actualizar precios

on:
  schedule:
    - cron: '17 6,14 * * *'
  workflow_dispatch:
    inputs:
      solo:
        description: 'Solo estas tiendas (ej.: mercadona,lidl). Vacío = todas'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leer precios de los supermercados
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SOLO: ${{ github.event.inputs.solo }}
        run: node scraper/index.mjs
      - name: Guardar los nuevos precios
        run: |
          git config user.name "actualizador-precios"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Precios $(date -u +'%Y-%m-%d %H:%M')"
          git push
